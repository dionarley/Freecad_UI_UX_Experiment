[project]
name = "freecad-ui-ux-experiment"
version = "0.1.0"
description = "Experimento de UI/UX para o FreeCAD (docks, QSS, menu contextual)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]
window = ["PySide6>=6.4"]

[tool.uv]
[dependency-groups]
dev = ["pytest>=7.0"]
window = ["PySide6>=6.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
